name: Extension Url
description: Submit your extension for inclusion in the list
title: "[New Extension]: "
body:
  - type: input
    id: name
    attributes:
      label: Extension name
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: Briefly describe its purpose and main features
    validations:
      required: true
      
  - type: input
    id: url
    attributes:
      label: Your URL
      description: Paste your extension link here
    validations:
      required: true

